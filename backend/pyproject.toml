[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
(
    migrations
)
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [
    "*/migrations/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]